<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôpital de Kumo — Unité Médicale</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#12141a;--card:#1c1f28;--tx:#e8e9ee;--mu:#9a9eb0;--ac:#7fb6d9;--ac2:#3d6f8f;--bd:#2c303c;--ok:#5cb98a}
:root:not([data-theme="light"]){color-scheme:dark}
:root[data-theme="dark"]{--bg:#12141a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
[data-clan=hatori]{--ac:#a77be0;--ac2:#5fbf4e}
[data-clan=arashi]{--ac:#4aa3ff;--ac2:#2a3f66}
[data-clan=yotsuki]{--ac:#f2d64b;--ac2:#b9c3d6}
[data-clan=chinoike]{--ac:#e0364a;--ac2:#7d0f1e}
[data-clan=burashi]{--ac:#f1efe6;--ac2:#4a4a52}
header{padding:28px 20px 10px;text-align:center}
header h1{margin:0;font-size:1.7rem;letter-spacing:.04em}
header p{margin:4px 0 0;color:var(--mu)}
.cross{color:var(--ok);font-size:1.6rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}
nav button.on{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h2{margin:0 0 12px;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:12px 14px}
.card b{display:block}
.card small{color:var(--mu)}
.rec{cursor:pointer}
.rec:hover{border-color:var(--ac)}
.blood{float:right;background:var(--ac2);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700;font-size:.85rem}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar span.l{width:64px;color:var(--mu)}
.bar div{height:16px;background:var(--ac);border-radius:4px;min-width:2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
.btn{background:var(--ac);color:#111;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:#b83a3a;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.modal.on{display:flex}
form{background:var(--card);border:1px solid var(--ac);border-radius:12px;width:100%;max-width:680px;padding:18px;margin:auto}
label{display:block;font-size:.85rem;color:var(--mu);margin-top:10px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:8px;font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h3{margin:22px 0 4px;color:var(--ac);font-size:1rem;letter-spacing:.05em}
.hint{font-size:.8rem;color:var(--mu);margin:0 0 6px}
.ant{border:1px dashed var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.empty{color:var(--mu);padding:20px 0}
@media(max-width:520px){.r2{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="cross">✚</div><h1>HÔPITAL DE KUMO</h1><p>Unité Médicale · Village caché des Nuages</p></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="modal" id="modal"><form id="form" onsubmit="return false"></form></div>
<script>
var CLANS={hatori:{n:"Hatori",e:"🐛",t:"Insecte & poison"},arashi:{n:"Arashi",e:"⚡",t:"Foudre bleue & noire"},yotsuki:{n:"Yotsuki",e:"🗡️",t:"Épée de foudre"},chinoike:{n:"Chinoike",e:"🩸",t:"Sang"},burashi:{n:"Burashi",e:"🖌️",t:"Encre & pinceau"},autre:{n:"Sans clan",e:"✚",t:"Autres habitants"}};
var GS=["A+","A-","B+","B-","AB+","AB-","O+","O-","Inconnu"];
var recs=[],view="stats",db=null,LS="kumo_dossiers";
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function ck(r){return CLANS[r.clan]?r.clan:"autre"}
function nav(){var h='<button data-v="stats" class="'+(view=="stats"?"on":"")+'">📊 Recensement</button>';
Object.keys(CLANS).forEach(function(k){var n=recs.filter(function(r){return ck(r)==k}).length;h+='<button data-v="'+k+'" data-clan="'+k+'" class="'+(view==k?"on":"")+'">'+CLANS[k].e+" "+CLANS[k].n+" ("+n+")</button>"});
var el=document.getElementById("nav");el.innerHTML=h;
el.querySelectorAll("button").forEach(function(b){b.onclick=function(){view=b.dataset.v;Q="";render()}})}
function stats(){var tot=recs.length,c={};GS.forEach(function(g){c[g]=0});
recs.forEach(function(r){c[GS.indexOf(r.groupe)>-1?r.groupe:"Inconnu"]++});
var mx=Math.max.apply(null,GS.map(function(g){return c[g]}).concat([1]));
var h='<div class="top"><h2>Recensement des groupes sanguins</h2><button class="btn" id="new">+ Nouveau dossier</button></div>';
h+='<p class="hint">'+tot+" habitant(s) recensé(s) d'après les dossiers médicaux.</p><div class=\"card\" style=\"margin-bottom:16px\">";
GS.forEach(function(g){h+='<div class="bar"><span class="l">'+g+'</span><div style="width:'+Math.round(c[g]/mx*70)+'%"></div><span>'+c[g]+"</span></div>"});
h+='</div><h2>Par clan</h2><div class="card tbl"><table><tr><th>Clan</th>'+GS.map(function(g){return"<th>"+g+"</th>"}).join("")+"<th>Total</th></tr>";
Object.keys(CLANS).forEach(function(k){var l=recs.filter(function(r){return ck(r)==k});
h+='<tr data-clan="'+k+'"><td style="color:var(--ac)">'+CLANS[k].e+" "+CLANS[k].n+"</td>"+GS.map(function(g){return"<td>"+l.filter(function(r){return(GS.indexOf(r.groupe)>-1?r.groupe:"Inconnu")==g}).length+"</td>"}).join("")+"<td><b>"+l.length+"</b></td></tr>"});
return h+"</table></div>"}
var Q="";
function cards(k){var q=Q.toLowerCase();var l=recs.filter(function(r){return ck(r)==k&&(!q||[r.prenom,r.groupe,r.residence,r.lieuNaissance,r.allergies,r.traitements,r.phobies,r.gouts].join(" ").toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return(a.prenom||"").localeCompare(b.prenom||"")});
if(!l.length)return'<p class="empty">'+(Q?"Aucun résultat.":"Aucun dossier pour ce clan.")+"</p>";
return'<div class="grid">'+l.map(function(r){return'<div class="card rec" data-id="'+esc(r.id)+'"><span class="blood">'+esc(r.groupe||"?")+"</span><b>"+esc(r.prenom)+" "+CLANS[k].n+"</b><small>"+(r.sexe=="F"?"Femme":"Homme")+" · "+esc(r.residence||"—")+"</small><br><small>"+((r.phys||[]).length+(r.psy||[]).length)+" antécédent(s)</small></div>"}).join("")+"</div>"}
function bindRecs(){document.querySelectorAll(".rec").forEach(function(c){c.onclick=function(){edit(c.dataset.id)}})}
function list(k){return'<div data-clan="'+k+'"><div class="top"><div><h2>'+CLANS[k].e+" Clan "+CLANS[k].n+'</h2><small class="hint">'+CLANS[k].t+'</small></div><button class="btn" id="new">+ Nouveau dossier</button></div><input id="q" type="search" placeholder="🔍 Rechercher (prénom, groupe sanguin, résidence, allergie…)" value="'+esc(Q)+'" style="margin-bottom:14px"><div id="res">'+cards(k)+"</div></div>"}
function render(){nav();var m=document.getElementById("main");m.innerHTML=view=="stats"?stats():list(view);
var n=document.getElementById("new");if(n)n.onclick=function(){edit(null)};
bindRecs();var qi=document.getElementById("q");if(qi)qi.oninput=function(){Q=qi.value;document.getElementById("res").innerHTML=cards(view);bindRecs()}}
function antHtml(a){a=a||{};return'<div class="ant"><label>Blessure / événement</label><input class="a-t" value="'+esc(a.t)+'"><div class="r2"><div><label>Date (ou approximation)</label><input class="a-d" value="'+esc(a.d)+'" placeholder="XX / XX / XXX"></div><div><label>Guérison</label><select class="a-g">'+["Totale","Partielle","Inaboutie"].map(function(o){return"<option"+(a.g==o?" selected":"")+">"+o+"</option>"}).join("")+'</select></div></div><label>Description</label><textarea class="a-x" rows="2">'+esc(a.x)+'</textarea><div class="r2"><div><label>Suivi médical</label><select class="a-s"><option'+(a.s!="Oui"?" selected":"")+'>Non</option><option'+(a.s=="Oui"?" selected":"")+'>Oui</option></select></div><div><label>Médecin (si suivi)</label><input class="a-m" value="'+esc(a.m)+'"></div></div><button type="button" class="btn g" onclick="this.parentNode.remove()">Retirer</button></div>'}
function edit(id){var r=recs.filter(function(x){return x.id==id})[0]||{clan:CLANS[view]&&view!="stats"?view:"hatori",sexe:"M"};
var f=document.getElementById("form");f.setAttribute("data-clan",ck(r));
function inp(n,l,ph){return"<label>"+l+'</label><input name="'+n+'" value="'+esc(r[n])+'" placeholder="'+(ph||"")+'">'}
f.innerHTML="<h2>"+(id?"Modifier le dossier":"Nouveau dossier médical")+"</h2>"+
'<div class="r2"><div>'+inp("prenom","Prénom","PRÉNOM")+'</div><div><label>Clan / Nom</label><select name="clan">'+Object.keys(CLANS).map(function(k){return'<option value="'+k+'"'+(ck(r)==k?" selected":"")+">"+CLANS[k].n+"</option>"}).join("")+"</select></div></div>"+
'<label>Sexe</label><select name="sexe"><option value="M"'+(r.sexe!="F"?" selected":"")+'>M</option><option value="F"'+(r.sexe=="F"?" selected":"")+">F</option></select>"+
'<div class="r2"><div>'+inp("naissance","Date de naissance","XXX")+"</div><div>"+inp("lieuNaissance","Lieu de naissance","VILLAGE, PAYS")+"</div></div>"+inp("residence","Lieu de résidence","VILLAGE, PAYS")+
'<label>Groupe sanguin</label><select name="groupe">'+GS.map(function(g){return"<option"+((r.groupe||"Inconnu")==g?" selected":"")+">"+g+"</option>"}).join("")+"</select>"+
inp("traitements","Traitement(s) en cours")+inp("allergies","Allergie(s)")+inp("phobies","Phobie(s)")+inp("gouts","Goût(s) préféré(s)")+
'<h3>・ANTÉCÉDENT(S) PHYSIQUE(S)・</h3><p class="hint">Anciennes blessures et traumatismes du corps (entailles, brûlures, bras coupés, addictions…)</p><div id="phys">'+(r.phys||[]).map(antHtml).join("")+'</div><button type="button" class="btn g" id="addp">+ Ajouter</button>'+
'<h3>・ANTÉCÉDENT(S) PSYCHOLOGIQUE(S)・</h3><p class="hint">Anciens traumatismes et chocs mentaux (deuil, dépression, burn-out…)</p><div id="psy">'+(r.psy||[]).map(antHtml).join("")+'</div><button type="button" class="btn g" id="addy">+ Ajouter</button>'+
'<div id="err" style="color:#ff7a7a;text-align:right;margin-top:10px"></div><div class="acts">'+(id?'<button type="button" class="btn d" id="del">Supprimer</button>':"")+'<button type="button" class="btn g" id="cx">Annuler</button><button type="button" class="btn" id="ok">Enregistrer</button></div>';
document.getElementById("modal").classList.add("on");
document.getElementById("addp").onclick=function(){document.getElementById("phys").insertAdjacentHTML("beforeend",antHtml())};
document.getElementById("addy").onclick=function(){document.getElementById("psy").insertAdjacentHTML("beforeend",antHtml())};
document.getElementById("cx").onclick=close;
if(id)var dl=document.getElementById("del");dl.onclick=function(){if(dl.dataset.s){remove(id);close()}else{dl.dataset.s=1;dl.textContent="Confirmer la suppression ?"}};
document.getElementById("ok").onclick=function(){var o={id:id||"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
["prenom","clan","sexe","naissance","lieuNaissance","residence","groupe","traitements","allergies","phobies","gouts"].forEach(function(n){o[n]=f.elements[n].value.trim()});
if(!o.prenom){msg("Le prénom est requis.");return}
function col(id){return[].slice.call(document.querySelectorAll("#"+id+" .ant")).map(function(e){function q(c){return e.querySelector(c).value.trim()}return{t:q(".a-t"),d:q(".a-d"),g:q(".a-g"),x:q(".a-x"),s:q(".a-s"),m:q(".a-m")}})}
o.phys=col("phys");o.psy=col("psy");save(o);close()}}
function msg(t){var e=document.getElementById("err");if(e)e.textContent=t}
function close(){document.getElementById("modal").classList.remove("on")}
function local(){try{localStorage.setItem(LS,JSON.stringify(recs))}catch(e){}}
function save(o){if(db){db.doc("dossiers/"+o.id).set(o).catch(function(){msg("Écriture refusée (droits insuffisants).")})}
else{var i=recs.map(function(x){return x.id}).indexOf(o.id);if(i>-1)recs[i]=o;else recs.push(o);local();render()}}
function remove(id){if(db){db.doc("dossiers/"+id).delete().catch(function(){msg("Suppression refusée.")})}else{recs=recs.filter(function(x){return x.id!=id});local();render()}}
try{recs=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){recs=[]}
render();
(function(){if(!window.claude||!claude.use)return;claude.use("db").then(function(d){if(!d)return;db=d;
d.collection("dossiers").onSnapshot(function(s){recs=s.docs.map(function(x){var o=x.data();o.id=x.id;return o});render()},function(){db=null})}).catch(function(){})})();
</script></body></html>
